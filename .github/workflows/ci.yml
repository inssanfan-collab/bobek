name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bobegim
          POSTGRES_PASSWORD: bobegim
          POSTGRES_DB: bobegim
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://bobegim:bobegim@localhost:5432/bobegim?schema=public
      PORTAL_DOMAIN: bobegim.local
      NEXT_PUBLIC_PORTAL_DOMAIN: bobegim.local
      SESSION_SECRET: ci-secret-not-used-in-production-0123456789abcdef
      COOKIE_SECURE: 'false'
      STORAGE_DIR: ./storage

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Кодогенерация Prisma
        run: pnpm exec prisma generate

      - name: Типы
        run: pnpm typecheck

      - name: Линтер
        run: pnpm lint

      - name: Юнит-тесты
        run: pnpm test

      - name: Миграции и демо-данные
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec tsx prisma/seed.ts

      - name: Сборка
        run: pnpm exec next build

      - name: Домены садов для e2e
        run: |
          echo "127.0.0.1 bobegim.local sad12.bobegim.local kunshuaq.bobegim.local ertegi.bobegim.local demo-sad.bobegim.local" \
            | sudo tee -a /etc/hosts

      - name: Браузер для e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Сквозные тесты
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
