# Блокировка роботов, перебирающих server actions (фильтр edusad-action-scan).
# Три неудачных POST на «/» за минуту — адрес закрыт на сутки для 80 и 443.
# Адрес владельца — в ignoreip из jail.local.
#
# На сервере: /etc/fail2ban/jail.d/edusad-action-scan.conf

[edusad-action-scan]
enabled  = true
backend  = auto
logpath  = /var/log/nginx/access.log
filter   = edusad-action-scan
port     = http,https
maxretry = 3
findtime = 1m
bantime  = 1d
