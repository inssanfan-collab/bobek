# Фильтр fail2ban: роботы, перебирающие уязвимости Next.js (server actions).
#
# Шлют пачку POST на корень сайта с поддельным заголовком Next-Action —
# приложение отвечает 404/500 «Failed to find Server Action» и будит
# владельца уведомлением об ошибке. Настоящих форм, отправляемых на «/»,
# с ошибкой почти не бывает: разве что одна после выкладки у того, кто
# держал страницу открытой.
#
# Только корень «/»: сотрудники садов после выкладки тоже получают 500
# на /admin/…, иногда по нескольку раз подряд — их блокировать нельзя.
#
# На сервере: /etc/fail2ban/filter.d/edusad-action-scan.conf

[Definition]
failregex = ^<HOST> - \S+ \[\] "POST / HTTP/[0-9.]+" (?:404|500)
ignoreregex =
