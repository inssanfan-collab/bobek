# Ограничение частоты запросов с одного адреса — портал и сайты садов.
# На сервере: /etc/nginx/conf.d/edusad-limits.conf (уровень http, поэтому
# действует и на блоки садов, которые пишет vsesad-certs, без правки шаблона).
#
# Лимиты подобраны по журналу nginx за 14 дней (28.10.2026): под них попали
# только сканеры и роботы, ни одного человека. Запас большой нарочно:
# у мобильных операторов РК за одним адресом сидит много людей (CGNAT).
# Превышение — 429 и строка «limiting requests … zone "edusad_…"» в error.log.

# Свои адреса не ограничиваем: сторож, скрипты, сам сервер.
geo $edusad_trusted {
    default        0;
    127.0.0.0/8    1;
    ::1            1;
    89.207.251.23  1;
}

# Пустой ключ — запрос не считается. Сервисы владельца на e04.kz
# сюда не относятся: у них свои лимиты в их конфиге.
map "$edusad_trusted:$host" $edusad_client {
    default               $binary_remote_addr;
    ~^1:                  "";
    ~*^0:(.+\.)?e04\.kz$  "";
}

# Страницы и server actions. Статика и картинки не считаются:
# одна страница тянет десятки файлов.
map $uri $edusad_pages_key {
    default                  $edusad_client;
    ~^/api/                  "";
    ~^/_next/(static|image)  "";
    ~*\.(png|jpe?g|gif|webp|svg|ico|css|js|woff2?|mp4|webm)$  "";
}

# API: присутствие в админке (раз в 30 с), посещения (раз в 15 с), health.
# /api/media — файлы садов на страницах, их не считаем.
map $uri $edusad_api_key {
    default          "";
    ~^/api/media/    "";
    ~^/api/          $edusad_client;
}

# Вход: и в админку портала, и в админки садов. Приложение отдельно
# блокирует учётную запись после пяти ошибок — это лимит на адрес.
map "$request_method:$uri" $edusad_login_key {
    default                "";
    ~^POST:/admin/login    $edusad_client;
}

limit_req_zone $edusad_pages_key zone=edusad_pages:10m rate=10r/s;
limit_req_zone $edusad_api_key   zone=edusad_api:5m   rate=2r/s;
limit_req_zone $edusad_login_key zone=edusad_login:5m rate=10r/m;

limit_req zone=edusad_pages burst=100 nodelay;
limit_req zone=edusad_api   burst=30  nodelay;
limit_req zone=edusad_login burst=10  nodelay;
limit_req_status 429;
# error, а не warn: у error.log порог error, warn туда не попадает.
limit_req_log_level error;
