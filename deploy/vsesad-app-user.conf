# Дополнение к vsesad.service: /etc/systemd/system/vsesad.service.d/app-user.conf
#
# Сайт работает от пользователя vsesad, а не root (11.10.2026). Файлы
# сайта принадлежат vsesad (это делает vsesad-deploy после сборки),
# .env — root:vsesad 640. Порт 3100 из интернета закрыт файрволом (ufw).
#
# Без -H 127.0.0.1: с ним middleware переписывал запрос сада на
# https://localhost:3100/s/<домен> (схема из X-Forwarded-Proto), шёл туда
# по TLS и падал EPROTO — все сайты садов отдавали 500.
#
# Откат на root: удалить этот файл, systemctl daemon-reload,
# systemctl restart vsesad.
[Service]
User=vsesad
Group=vsesad
ExecStart=
ExecStart=/usr/bin/node /var/www/vsesad/node_modules/next/dist/bin/next start
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=full
