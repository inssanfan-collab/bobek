# Только база для локальной разработки.
# Приложение при этом запускается напрямую через pnpm dev — так быстрее
# пересборка и работает горячая перезагрузка.
#
#   docker compose -f docker-compose.dev.yml up -d
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: bobegim-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bobegim
      POSTGRES_PASSWORD: bobegim
      POSTGRES_DB: bobegim
    ports:
      # 5433 снаружи намеренно: на машине разработчика часто уже стоит свой
      # PostgreSQL на 5432, и тогда Prisma молча стучится в него, а не сюда —
      # ошибка выглядит как «неверный пароль», а не как конфликт портов.
      - '5433:5432'
    volumes:
      - bobegim-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bobegim']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bobegim-dev-data:
